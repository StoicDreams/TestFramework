name: Build and Publish Test Framework

on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."
  BUILD_CONFIGURATION: "Release"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration ${{ env.BUILD_CONFIGURATION }}
      - name: Pack Test Framework
        run: dotnet pack StoicDreams.TestFramework/StoicDreams.TestFramework.csproj --no-build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} --output NugetPackages
      - name: Pack Blazor Test Framework
        run: dotnet pack StoicDreams.TestFramework.Blazor/StoicDreams.TestFramework.Blazor.csproj --no-build --no-restore --configuration ${{ env.BUILD_CONFIGURATION }} --output NugetPackages
      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: NugetPackages/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download NuGet Packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: NugetPackages/
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USERNAME }}
      - name: Push Test Framework package to nuget store
        run: dotnet nuget push 'NugetPackages/StoicDreams.TestFramework.*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --source ${{ env.NUGET_SOURCE}} > nugetpushtf.txt; echo $(cat nugetpushtf.txt)
      - name: Push Blazor Test Framework package to nuget store
        run: dotnet nuget push 'NugetPackages/StoicDreams.TestFramework.Blazor.*.nupkg' --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate --source ${{ env.NUGET_SOURCE}} > nugetpushbtf.txt; echo $(cat nugetpushbtf.txt)
